<ion-header>
    <ion-toolbar color="danger">
        <ion-title>Eyeball</ion-title>
        <ion-buttons slot="end">
            <ion-button mode="ios" color="light" (click)="closeModal(null)">
                <ion-icon slot="icon-only" name="close"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content color="dark" class="ion-padding">
    Keep your eye on mine, then tell me where it hides. Guess true and I'll open the way.

    <ion-grid>
        <ion-row id="shuffleRow">
            <ion-col
                class="tile"
                [ngClass]="getAniClass(0)"
                [@my1stAnimation]="oneSlot"
                (@my1stAnimation.done)="onAnimationEvent($event)"
                (click)="guessShell(0)"
                [class.voted]="flipped"
            >
                <div
                    *ngIf="
                        (rightAnswer == 0 && shuffleCount == 0) || (!gameStart && possibleAnswers[0].id == rightAnswer)
                    "
                    class="eye"
                ></div>
            </ion-col>
            <ion-col
                [@my2ndAnimation]="twoSlot"
                [class.voted]="flipped"
                class="tile"
                [ngClass]="getAniClass(1)"
                (click)="guessShell(1)"
            >
                <div
                    *ngIf="
                        (rightAnswer == 1 && shuffleCount == 0) || (!gameStart && possibleAnswers[1].id == rightAnswer)
                    "
                    class="eye"
                ></div>
            </ion-col>
            <ion-col
                [@my3rdAnimation]="threeSlot"
                [class.voted]="flipped"
                class="tile"
                [ngClass]="getAniClass(2)"
                (click)="guessShell(2)"
            >
                <div
                    *ngIf="
                        (rightAnswer == 2 && shuffleCount == 0) || (!gameStart && possibleAnswers[2].id == rightAnswer)
                    "
                    class="eye"
                ></div>
            </ion-col>
            <ion-col
                [@my4thAnimation]="fourSlot"
                [class.voted]="flipped"
                class="tile"
                [ngClass]="getAniClass(3)"
                (click)="guessShell(3)"
            >
                <div
                    *ngIf="
                        (rightAnswer == 3 && shuffleCount == 0) || (!gameStart && possibleAnswers[3].id == rightAnswer)
                    "
                    class="eye"
                ></div>
            </ion-col>
        </ion-row>
    </ion-grid>
</ion-content>
