<ion-content>
    <div id="row1">
        <div id="column1" class="intro"></div>
        <div id="column2" class="left">
            <p class="text">
                <span class="text" *ngIf="firstLine">The walls moved for you. They never move for anyone.</span>

                <span class="text" *ngIf="secondLine">
                    <br />
                    <br />
                    One of my creatures helped you. I will find out which. I have all the time in the world.
                </span>

                <span class="text" *ngIf="thirdLine">
                    <br />
                    <br />
                    Enjoy the daylight. Doors reopen, and Yabdib loves a returning guest.
                </span>
            </p>

            <ion-button
                *ngIf="buttonReady"
                (click)="beginMaze()"
                shape="round"
                expand="block"
                color="light"
                fill="outline"
                class="fade"
            >
                Collect Reward
            </ion-button>
        </div>
    </div>
</ion-content>
