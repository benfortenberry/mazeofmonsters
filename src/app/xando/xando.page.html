<ion-header>
    <ion-toolbar color="danger">
        <ion-title>Xs and Os</ion-title>
        <ion-buttons slot="end">
            <ion-button mode="ios" color="light" (click)="closeModal(null)">
                <ion-icon slot="icon-only" name="close"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content color="dark" class="ion-padding">
    <p>Three in a row and the way opens. Beat me, friend.</p>
    <ion-grid>
        <ion-row>
            <ion-col class="tile mark" [class.picked]="getStatus(0)" (click)="markTile(0)">
                <img *ngIf="markImg(0)" [src]="markImg(0)" alt="" />
            </ion-col>
            <ion-col class="tile mark" [class.picked]="getStatus(1)" (click)="markTile(1)">
                <img *ngIf="markImg(1)" [src]="markImg(1)" alt="" />
            </ion-col>
            <ion-col class="tile mark" [class.picked]="getStatus(2)" (click)="markTile(2)">
                <img *ngIf="markImg(2)" [src]="markImg(2)" alt="" />
            </ion-col>
        </ion-row>
        <ion-row>
            <ion-col class="tile mark" [class.picked]="getStatus(3)" (click)="markTile(3)">
                <img *ngIf="markImg(3)" [src]="markImg(3)" alt="" />
            </ion-col>
            <ion-col class="tile mark" [class.picked]="getStatus(4)" (click)="markTile(4)">
                <img *ngIf="markImg(4)" [src]="markImg(4)" alt="" />
            </ion-col>
            <ion-col class="tile mark" [class.picked]="getStatus(5)" (click)="markTile(5)">
                <img *ngIf="markImg(5)" [src]="markImg(5)" alt="" />
            </ion-col>
        </ion-row>
        <ion-row>
            <ion-col class="tile mark" [class.picked]="getStatus(6)" (click)="markTile(6)">
                <img *ngIf="markImg(6)" [src]="markImg(6)" alt="" />
            </ion-col>
            <ion-col class="tile mark" [class.picked]="getStatus(7)" (click)="markTile(7)">
                <img *ngIf="markImg(7)" [src]="markImg(7)" alt="" />
            </ion-col>
            <ion-col class="tile mark" [class.picked]="getStatus(8)" (click)="markTile(8)">
                <img *ngIf="markImg(8)" [src]="markImg(8)" alt="" />
            </ion-col>
        </ion-row>
    </ion-grid>
</ion-content>
