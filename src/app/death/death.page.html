<ion-content>
    <div id="row1">
        <div id="column1" class="left">
            <p class="text">
                <span class="text" *ngIf="firstLine">{{ taunt.first }}</span>

                <span class="text" *ngIf="secondLine">
                    <br />
                    <br />
                    {{ taunt.second }}
                </span>

                <span class="text" *ngIf="thirdLine">
                    <br />
                    <br />
                    {{ taunt.third }}
                </span>
            </p>

            <ion-button
                *ngIf="buttonReady"
                class="fade"
                shape="round"
                expand="block"
                (click)="tryAgain()"
                color="light"
                fill="outline"
            >
                Try Again
            </ion-button>
        </div>
        <div id="column2" class="intro long-fade" [ngStyle]="{ 'background-image': monsterImageUrl }"></div>
    </div>
</ion-content>
