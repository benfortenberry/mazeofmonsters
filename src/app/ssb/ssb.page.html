<ion-header>
    <ion-toolbar color="danger">
        <ion-title>Sword, Shield, &amp; Bow</ion-title>
        <ion-buttons slot="end">
            <ion-button mode="ios" color="light" (click)="closeModal(null)">
                <ion-icon slot="icon-only" name="close"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content color="dark" class="ion-padding">
    <!-- Score is always visible so the best-of-3 reads clearly. -->
    <p class="score">You {{ playerScore }} &ndash; {{ cpuScore }} Me</p>

    <div *ngIf="humanTurn">
        <p>
            Best me at the old game and I'll open the way. Shield beats bow, bow beats sword, sword beats shield. First
            to two wins.
        </p>
        <ion-grid>
            <ion-row>
                <ion-col class="tile weapon hover pointer" (click)="makeChoice('sword')">
                    <img src="assets/ssb/LongSword.png" alt="sword" />
                </ion-col>
                <ion-col class="tile weapon hover pointer" (click)="makeChoice('shield')">
                    <img src="assets/ssb/RoundShield.png" alt="shield" />
                </ion-col>
                <ion-col class="tile weapon hover pointer" (click)="makeChoice('bow')">
                    <img src="assets/ssb/ShortBow.png" alt="bow" />
                </ion-col>
            </ion-row>
        </ion-grid>
    </div>

    <div *ngIf="!humanTurn">
        <p>I played {{ cpuChoice }}.</p>

        <ion-grid>
            <ion-row>
                <ion-col class="tile weapon">
                    <img *ngIf="isSword()" src="assets/ssb/LongSword.png" alt="sword" />
                </ion-col>
                <ion-col class="tile weapon">
                    <img *ngIf="isShield()" src="assets/ssb/RoundShield.png" alt="shield" />
                </ion-col>
                <ion-col class="tile weapon">
                    <img *ngIf="isBow()" src="assets/ssb/ShortBow.png" alt="bow" />
                </ion-col>
            </ion-row>
        </ion-grid>

        <!-- Per-round result, so each round of the best-of-3 reads clearly. -->
        <p class="round-result" *ngIf="roundResult === 'win'">You take the round.</p>
        <p class="round-result" *ngIf="roundResult === 'lose'">I take that one.</p>
        <p class="round-result" *ngIf="roundResult === 'tie'">A tie. Choose again.</p>
    </div>
</ion-content>
