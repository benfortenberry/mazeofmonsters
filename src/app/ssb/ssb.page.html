<ion-header>
    <ion-toolbar color="danger">
        <ion-title>Sword, Shield, &amp; Bow</ion-title>
        <ion-buttons slot="end">
            <ion-button mode="ios" color="light" (click)="closeModal(null)">
                <ion-icon slot="icon-only" name="close"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content color="dark" class="ion-padding">
    <p *ngIf="goAgain">We tied! Let's play again...</p>

    <div *ngIf="!goAgain">
        <p *ngIf="humanTurn">
            Beat me in this game of Sword, Shield, & Bow for help. Shield beats bow, bow beats sword, and sword beats
            shield.
        </p>
        <ion-grid *ngIf="humanTurn">
            <ion-row>
                <ion-col class="tile weapon hover pointer" (click)="makeChoice('sword')">
                    <img src="assets/ssb/LongSword.png" alt="sword" />
                </ion-col>
                <ion-col class="tile weapon hover pointer" (click)="makeChoice('shield')">
                    <img src="assets/ssb/RoundShield.png" alt="shield" />
                </ion-col>
                <ion-col class="tile weapon hover pointer" (click)="makeChoice('bow')">
                    <img src="assets/ssb/ShortBow.png" alt="bow" />
                </ion-col>
            </ion-row>
        </ion-grid>

        <p *ngIf="!humanTurn">I picked {{ cpuChoice }}!</p>

        <ion-grid *ngIf="!humanTurn">
            <ion-row>
                <ion-col class="tile weapon">
                    <img *ngIf="isSword()" src="assets/ssb/LongSword.png" alt="sword" />
                </ion-col>
                <ion-col class="tile weapon">
                    <img *ngIf="isShield()" src="assets/ssb/RoundShield.png" alt="shield" />
                </ion-col>
                <ion-col class="tile weapon">
                    <img *ngIf="isBow()" src="assets/ssb/ShortBow.png" alt="bow" />
                </ion-col>
            </ion-row>
        </ion-grid>
    </div>
</ion-content>
