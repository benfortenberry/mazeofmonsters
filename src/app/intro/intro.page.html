<ion-content class="main">
    <div id="row1">
        <div id="column1" class="left">
            <p class="text">
                <span class="text" *ngIf="firstLine">A soft little human. How promising. I am Yabdib.</span>

                <span class="text" *ngIf="secondLine">
                    <br />
                    <br />
                    Fifteen minutes to reach the end of my maze. Fail, and you stay with the others.
                </span>

                <span class="text" *ngIf="thirdLine">
                    <br />
                    <br />
                    My collection grows.
                </span>
            </p>
            <ion-button
                *ngIf="buttonReady"
                (click)="beginMaze()"
                shape="round"
                expand="block"
                color="light"
                fill="outline"
                class="fade"
            >
                Begin Maze
            </ion-button>

            <div class="loader fade" *ngIf="loading">
                <p>Rearranging the walls&hellip; {{ loadPercent }}%</p>
                <ion-progress-bar color="light" [value]="loadPercent / 100"></ion-progress-bar>
            </div>
        </div>

        <div id="column2" class="intro"></div>
    </div>
</ion-content>
