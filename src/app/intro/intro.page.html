<ion-content class="main">
    <div id="row1">
        <div id="column1" class="left">
            <p class="text">
                <span class="text" *ngIf="firstLine">What a nice looking human!</span>

                <span class="text" *ngIf="secondLine">
                    <br />
                    <br />
                    Unfortunately, you have 15 minutes to reach the end of my maze to avoid 
                    being turned into one of my creations.
                </span>

                <span class="text" *ngIf="thirdLine">
                    <br />
                    <br />

                    It's a wonderful collection.
                    <!-- I wonder if you'll have fur, scales or horns. -->
                    <!-- I'm sure you'll git right in. -->
                </span>
            </p>
            <ion-button
                *ngIf="buttonReady"
                (click)="beginMaze()"
                shape="round"
                expand="block"
                color="light"
                fill="outline"
                class="fade"
            >
                Begin Maze
            </ion-button>

            <div class="loader fade" *ngIf="loading">
                <p>Preparing the maze&hellip; {{ loadPercent }}%</p>
                <ion-progress-bar color="light" [value]="loadPercent / 100"></ion-progress-bar>
            </div>
        </div>

        <div id="column2" class="intro"></div>
    </div>
</ion-content>
