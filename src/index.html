<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Maze</title>

        <base href="/" />

        <meta
            name="viewport"
            content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <meta name="format-detection" content="telephone=no" />
        <meta name="msapplication-tap-highlight" content="no" />

        <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

        <!-- Monsters: preloaded (eager/high-priority) so the first encounter
             shows instantly. They're small (~60-130KB each) after optimization,
             so loading them up front is cheap. -->
        <link rel="preload" href="assets/monsters/DivineGuardian.png" as="image" />
        <link rel="preload" href="assets/monsters/Dragon.png" as="image" />
        <link rel="preload" href="assets/monsters/Goblin.png" as="image" />
        <link rel="preload" href="assets/monsters/Lichlord.png" as="image" />
        <link rel="preload" href="assets/monsters/Naga.png" as="image" />
        <link rel="preload" href="assets/monsters/Orc.png" as="image" />
        <link rel="preload" href="assets/monsters/Ratman.png" as="image" />
        <link rel="preload" href="assets/monsters/Treefolk.png" as="image" />
        <link rel="preload" href="assets/monsters/Troll.png" as="image" />
        <link rel="preload" href="assets/monsters/zombie.png" as="image" />

        <!-- Death-screen artwork (one shown at random when you lose). -->
        <link rel="prefetch" href="assets/death/boss_goblinbigboss.png" as="image" />
        <link rel="prefetch" href="assets/death/boss_thenightmother.png" as="image" />
        <link rel="prefetch" href="assets/death/boss_voidelemental.png" as="image" />
        <link rel="prefetch" href="assets/death/monster_crystalgolem.png" as="image" />
        <link rel="prefetch" href="assets/death/monster_deepelf.png" as="image" />
        <link rel="prefetch" href="assets/death/monster_demilich.png" as="image" />
        <link rel="prefetch" href="assets/death/monster_devilkin.png" as="image" />
        <link rel="prefetch" href="assets/death/monster_dragonwhelp.png" as="image" />
        <link rel="prefetch" href="assets/death/monster_fireelemental.png" as="image" />
        <link rel="prefetch" href="assets/death/monster_goblinveteran.png" as="image" />
        <link rel="prefetch" href="assets/death/monster_imp.png" as="image" />
        <link rel="prefetch" href="assets/death/monster_minotaur.png" as="image" />
        <link rel="prefetch" href="assets/death/monster_ooze.png" as="image" />
        <link rel="prefetch" href="assets/death/monster_ratling.png" as="image" />
        <link rel="prefetch" href="assets/death/monster_treefolk.png" as="image" />
        <link rel="prefetch" href="assets/death/monster_werewolfcub.png" as="image" />

        <!-- Maze wall/floor/ceiling textures are shown the instant you enter
             the maze, so fetch them eagerly (preload = high priority) rather
             than prefetch (idle-only) to avoid pop-in. -->
        <link rel="preload" href="assets/new-sandstone-3.jpg" as="image" />
        <link rel="preload" href="assets/new-sandstone-4.jpg" as="image" />
        <link rel="preload" href="assets/new-sandstone-5.jpg" as="image" />
        <link rel="preload" href="assets/sandy.jpg" as="image" />
        <link rel="preload" href="assets/stone.jpg" as="image" />
        <link rel="preload" href="assets/sandstone-large.jpg" as="image" />

        <!-- add to homescreen for ios -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    </head>
    <body>
        <app-root></app-root>
    </body>
</html>
