<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Maze</title>

        <base href="/" />

        <meta
            name="viewport"
            content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <meta name="format-detection" content="telephone=no" />
        <meta name="msapplication-tap-highlight" content="no" />

        <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

        <!-- Prefetch the gameplay-critical artwork (monsters + maze textures)
             so they're cached before the player reaches the maze. This is the
             single preload mechanism for the app; browser-native, low-priority,
             non-blocking. Only referenced assets are listed. -->
        <link rel="prefetch" href="assets/monsters/DivineGuardian.png" as="image" />
        <link rel="prefetch" href="assets/monsters/Dragon.png" as="image" />
        <link rel="prefetch" href="assets/monsters/Goblin.png" as="image" />
        <link rel="prefetch" href="assets/monsters/Lichlord.png" as="image" />
        <link rel="prefetch" href="assets/monsters/Naga.png" as="image" />
        <link rel="prefetch" href="assets/monsters/Orc.png" as="image" />
        <link rel="prefetch" href="assets/monsters/Ratman.png" as="image" />
        <link rel="prefetch" href="assets/monsters/Treefolk.png" as="image" />
        <link rel="prefetch" href="assets/monsters/Troll.png" as="image" />
        <link rel="prefetch" href="assets/monsters/zombie.png" as="image" />
        <link rel="prefetch" href="assets/sandstone-large.jpg" as="image" />
        <link rel="prefetch" href="assets/new-sandstone-3.jpg" as="image" />
        <link rel="prefetch" href="assets/new-sandstone-4.jpg" as="image" />
        <link rel="prefetch" href="assets/new-sandstone-5.jpg" as="image" />
        <link rel="prefetch" href="assets/sandy.jpg" as="image" />
        <link rel="prefetch" href="assets/stone.jpg" as="image" />

        <!-- add to homescreen for ios -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    </head>
